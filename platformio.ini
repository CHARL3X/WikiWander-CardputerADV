; Wikiwander -- standalone Cardputer ADV app, guest under bmorcelli's
; Launcher. Two envs:
;   - native: host build for PC-side parser tests (`pio run -e native -t exec`)
;   - cardputer: device build (added in Phase 4; placeholder shell for now)

[platformio]
default_envs = native

[env:native]
platform = native
build_flags =
    -std=c++17
    -DWIKIWANDER_PC_BUILD
lib_deps =
    bblanchon/ArduinoJson @ ^7.0
build_src_filter =
    +<test_main.cpp>

[env:cardputer]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3

build_src_filter =
    -<test_main.cpp>
    -<test_walker.cpp>
    +<main.cpp>
    +<*/>

extra_scripts = post:support/copy_dist.py

lib_deps =
    m5stack/M5Cardputer
    bblanchon/ArduinoJson @ ^7.0
