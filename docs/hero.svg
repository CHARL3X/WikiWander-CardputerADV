<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2E9CF"/>
      <stop offset="100%" stop-color="#E9DEBA"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A211A"/>
      <stop offset="50%" stop-color="#1A1410"/>
      <stop offset="100%" stop-color="#120D08"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="rgba(60,40,14,0)"/>
      <stop offset="100%" stop-color="rgba(60,40,14,0.20)"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.15  0 0 0 0 0.10  0 0 0 0 0.05  0 0 0 0.35 0"/>
    </filter>
  </defs>

  <!-- Paper background + texture + vignette -->
  <rect width="1200" height="460" fill="url(#paper)"/>
  <rect width="1200" height="460" filter="url(#noise)" opacity="0.4" style="mix-blend-mode:multiply"/>
  <rect width="1200" height="460" fill="url(#vignette)"/>

  <!-- Decorative rule top-left + eyebrow -->
  <g transform="translate(80,68)">
    <line x1="0" y1="0" x2="36" y2="0" stroke="#8E6E3A" stroke-width="1.2"/>
    <text x="46" y="4" font-family="'Courier New', monospace" font-size="11" fill="#7D6A4A" letter-spacing="3.2">AN ESP32-S3 POCKET LIBRARY</text>
  </g>

  <!-- Wordmark: italic serif. Size + letter-spacing tuned so the text
       still feels like a hero but fits cleanly in the left column
       even when the user has Fraunces installed (wider than the
       Georgia fallback). -->
  <text x="80" y="200"
        font-family="Fraunces, 'Cormorant Garamond', Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-weight="600"
        font-size="124"
        fill="#1F160B"
        letter-spacing="-5">Wikiwander<tspan font-weight="300" dx="-4">.</tspan></text>

  <!-- Tagline with em-dash -->
  <text x="80" y="244"
        font-family="'EB Garamond', Georgia, serif"
        font-style="italic"
        font-size="24"
        fill="#4A3A24"><tspan fill="#8E6E3A">— </tspan>a small pocket library for the M5Stack Cardputer ADV</text>

  <!-- Colophon-style aside in the lower-left -->
  <g transform="translate(80,300)">
    <line x1="0" y1="-6" x2="0" y2="100" stroke="#C5B084" stroke-width="2"/>
    <text x="14" y="8" font-family="'Courier New', monospace" font-size="10" fill="#8E6E3A" letter-spacing="2.6">COLOPHON</text>
    <text x="14" y="34" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="15" fill="#4A3A24">
      <tspan x="14" dy="0">Sepia text on warm black,</tspan>
      <tspan x="14" dy="20">composed in RAM and pushed</tspan>
      <tspan x="14" dy="20">once per frame. Wikipedia&apos;s</tspan>
      <tspan x="14" dy="20">entire pool in 240 by 135 pixels.</tspan>
    </text>
  </g>

  <!-- Ornament between text + device -->
  <text x="770" y="240" font-family="'EB Garamond', Georgia, serif" font-style="italic" font-size="32" fill="#8E6E3A" text-anchor="middle">❦</text>

  <!-- === DEVICE MOCKUP === -->
  <!-- Device proportions adjusted: real Cardputer ADV has very little
       space between the keyboard and bottom edge. Total height
       drops from 340 → 252 by tightening the keyboard-to-label gap. -->
  <g transform="translate(840,100)">
    <!-- Device body (now 320 x 252) -->
    <rect x="0" y="0" width="320" height="252" rx="14" fill="url(#device)"/>
    <!-- Top highlight -->
    <rect x="0" y="0" width="320" height="14" rx="14" fill="rgba(255,220,170,0.07)"/>
    <!-- Screen frame -->
    <rect x="18" y="22" width="284" height="160" rx="4" fill="#050402"/>
    <rect x="20" y="24" width="280" height="156" rx="3" fill="#0A0805"/>

    <!-- === SCREEN CONTENT === -->
    <g transform="translate(20,24)">
      <!-- Status bar -->
      <text x="6" y="14" font-family="'Courier New', monospace" font-size="9" fill="#C68C5A" letter-spacing="0.5">WIKI</text>
      <text x="274" y="14" font-family="'Courier New', monospace" font-size="9" fill="#645542" text-anchor="end">link 3/14</text>
      <line x1="0" y1="18" x2="280" y2="18" stroke="rgba(120,90,50,0.18)" stroke-width="1"/>

      <!-- Article title in serif italic -->
      <text x="6" y="36"
            font-family="'EB Garamond', Georgia, serif"
            font-style="italic"
            font-weight="600"
            font-size="16"
            fill="#E6A560">Hypertext.</text>

      <!-- Description + meta row -->
      <text x="6" y="50" font-family="'Courier New', monospace" font-size="8.5" fill="#645542">text w/ references</text>
      <text x="274" y="50" font-family="'Courier New', monospace" font-size="8.5" fill="#8E6E3A" text-anchor="end">~1 min · 14 links</text>

      <!-- Body text with an inverted-active-link highlight -->
      <g font-family="'Courier New', monospace" font-size="9" fill="#D8C9A8">
        <text x="6" y="68">Hypertext is text displayed</text>
        <text x="6" y="80">on a <tspan fill="#C68C5A" text-decoration="underline">computer display</tspan> with</text>
        <text x="6" y="92">references (</text>
        <rect x="62" y="84" width="56" height="11" fill="#E6A560"/>
        <text x="64" y="92" font-family="'Courier New', monospace" font-size="9" fill="#0A0805" font-weight="bold">hyperlinks</text>
        <text x="119" y="92">) to other</text>
        <text x="6" y="104">text that the reader can</text>
        <text x="6" y="116">immediately access via</text>
        <text x="6" y="128"><tspan fill="#C68C5A" text-decoration="underline">mouse</tspan> click, key, or touch.</text>
      </g>

      <!-- Scrollbar on right edge -->
      <line x1="277" y1="22" x2="277" y2="138" stroke="rgba(120,90,50,0.30)" stroke-width="1"/>
      <rect x="276" y="44" width="2" height="48" fill="#C68C5A"/>

      <!-- Hint bar -->
      <line x1="0" y1="142" x2="280" y2="142" stroke="rgba(120,90,50,0.18)" stroke-width="1"/>
      <text x="6" y="152" font-family="'Courier New', monospace" font-size="8" fill="#645542">tab link · enter · pick</text>
      <text x="274" y="152" font-family="'Courier New', monospace" font-size="8" fill="#645542" text-anchor="end">r · s · q</text>
    </g>

    <!-- Keyboard suggestion -- 4 staggered rows of tiny keys, real
         Cardputer ADV proportions: keyboard butts right up against
         the bottom edge with only a few px of breathing room. -->
    <g transform="translate(24, 190)">
      <g fill="#1f1813">
        <!-- Row 1 -->
        <rect x="0"   y="0"  width="16" height="8" rx="1.5"/>
        <rect x="19"  y="0"  width="16" height="8" rx="1.5"/>
        <rect x="38"  y="0"  width="16" height="8" rx="1.5"/>
        <rect x="57"  y="0"  width="16" height="8" rx="1.5"/>
        <rect x="76"  y="0"  width="16" height="8" rx="1.5"/>
        <rect x="95"  y="0"  width="16" height="8" rx="1.5"/>
        <rect x="114" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="133" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="152" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="171" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="190" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="209" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="228" y="0"  width="16" height="8" rx="1.5"/>
        <rect x="247" y="0"  width="20" height="8" rx="1.5"/>
        <!-- Row 2 -->
        <rect x="2"   y="11" width="16" height="8" rx="1.5"/>
        <rect x="21"  y="11" width="16" height="8" rx="1.5"/>
        <rect x="40"  y="11" width="16" height="8" rx="1.5"/>
        <rect x="59"  y="11" width="16" height="8" rx="1.5"/>
        <rect x="78"  y="11" width="16" height="8" rx="1.5"/>
        <rect x="97"  y="11" width="16" height="8" rx="1.5"/>
        <rect x="116" y="11" width="16" height="8" rx="1.5"/>
        <rect x="135" y="11" width="16" height="8" rx="1.5"/>
        <rect x="154" y="11" width="16" height="8" rx="1.5"/>
        <rect x="173" y="11" width="16" height="8" rx="1.5"/>
        <rect x="192" y="11" width="16" height="8" rx="1.5"/>
        <rect x="211" y="11" width="16" height="8" rx="1.5"/>
        <rect x="230" y="11" width="16" height="8" rx="1.5"/>
        <rect x="249" y="11" width="18" height="8" rx="1.5"/>
        <!-- Row 3 -->
        <rect x="6"   y="22" width="16" height="8" rx="1.5"/>
        <rect x="25"  y="22" width="16" height="8" rx="1.5"/>
        <rect x="44"  y="22" width="16" height="8" rx="1.5"/>
        <rect x="63"  y="22" width="16" height="8" rx="1.5"/>
        <rect x="82"  y="22" width="16" height="8" rx="1.5"/>
        <rect x="101" y="22" width="16" height="8" rx="1.5"/>
        <rect x="120" y="22" width="16" height="8" rx="1.5"/>
        <rect x="139" y="22" width="16" height="8" rx="1.5"/>
        <rect x="158" y="22" width="16" height="8" rx="1.5"/>
        <rect x="177" y="22" width="16" height="8" rx="1.5"/>
        <rect x="196" y="22" width="16" height="8" rx="1.5"/>
        <rect x="215" y="22" width="16" height="8" rx="1.5"/>
        <rect x="234" y="22" width="32" height="8" rx="1.5"/>
        <!-- Row 4 (spacebar) -->
        <rect x="10"  y="33" width="20" height="8" rx="1.5"/>
        <rect x="33"  y="33" width="20" height="8" rx="1.5"/>
        <rect x="56"  y="33" width="100" height="8" rx="1.5"/>
        <rect x="159" y="33" width="20" height="8" rx="1.5"/>
        <rect x="182" y="33" width="20" height="8" rx="1.5"/>
        <rect x="205" y="33" width="20" height="8" rx="1.5"/>
        <rect x="228" y="33" width="20" height="8" rx="1.5"/>
        <rect x="251" y="33" width="16" height="8" rx="1.5"/>
      </g>
    </g>

    <!-- Device label moved tight to bottom (no dead space) -->
    <text x="160" y="244" font-family="'Courier New', monospace" font-size="9" fill="rgba(225,200,160,0.32)" letter-spacing="3" text-anchor="middle">CARDPUTER · ADV</text>
  </g>

  <!-- Bottom rule + version chip -->
  <line x1="80" y1="424" x2="180" y2="424" stroke="#C5B084" stroke-width="1"/>
  <text x="80" y="440" font-family="'Courier New', monospace" font-size="10" fill="#7D6A4A" letter-spacing="2.6">VERSION 0.1 · MIT</text>

</svg>
